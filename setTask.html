<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>timeee</title>
</head>
<body>
    <div class="setTaskDiv">
      <h1>SET YOUR TASK</h1>
      <img src="pencil.png" alt="Pencil" />
      <p>
        Write down the task you want to achieve during this time 
      </p>
      <input
        type="text"
        placeholder="Write your task..."
        id="task-value"
        size="20"
      />
      <button id="set-timer-btn">SET TIMER</button>
    </div>

    <script>
      document.getElementById("set-timer-btn").addEventListener("click", () => {
        const task = document.getElementById("task-value").value;

        localStorage.setItem("taskValue", task);
        window.electronAPI.loadPage("timerBegins.html");
      });
    </script>
</body>
</html>
